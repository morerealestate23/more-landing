<html lang="en">

<title>MORE — More than real estate</title>
<meta name="description" content="MORE finds, hands over and manages homes for people arriving in Cairo — and looks after the owners who supply them.">
<link rel="icon" href="more-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7F1}
a{color:#A8531B;text-decoration:none}
a:hover{color:#08304A}
*{box-sizing:border-box}
img{max-width:100%;display:block}
.lp{container-type:inline-size;container-name:lp}
@container lp (max-width:720px){
  .lp-nav{padding:11px 16px !important;gap:10px !important}
  .lp-nav-cta{padding:0 17px !important;font-size:13px !important;min-height:44px !important;display:flex !important;align-items:center !important}
  .lp-lang{padding:0 15px !important;font-size:12.5px !important;min-height:44px !important;display:flex !important;align-items:center !important}
  .lp-hero{padding:62px 18px 70px 18px !important;gap:20px !important}
  .lp-sec{padding-left:18px !important;padding-right:18px !important}
  .lp-pad-lg{padding-top:52px !important;padding-bottom:58px !important}
  .lp-grid{gap:10px !important}
  .lp-steps{gap:22px !important;margin-top:32px !important}
  .lp-contact{gap:30px !important}
  .lp-card{padding:18px 18px !important}
  .lp-foot-row{gap:18px !important}
  .lp-chip{min-height:44px !important;padding:0 17px !important;display:flex !important;align-items:center !important}
  .lp-fab{padding:13px 16px !important;font-size:0 !important;gap:0 !important;bottom:16px !important}
  .lp-fab svg{width:22px !important;height:22px !important}
}
@container lp (max-width:420px){
  .lp-nav{padding:10px 13px !important;gap:7px !important}
  .lp-nav-cta{padding:0 14px !important;font-size:12.5px !important}
  .lp-lang{padding:0 12px !important}
  .lp-hero-btn{width:100% !important;text-align:center !important}
  .lp-since{flex-direction:column !important;gap:7px !important}
  .lp-since-dot{display:none !important}
}
.lp-role-card{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.lp-role-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(8,48,74,.12)}
</style>
</head>
<body>
<div id="app"></div>
<script>

const AR = {

  efKicker: "شريكنا",
  efTitle: "MORE × الفايز",
  efBody: "الفايز للاستثمار العقاري شريكنا في القاهرة. هم يجلبون العلاقات مع المطوّرين ومحفظة استثمارية، ونحن نجلب العملاء والاستشارة والإدارة اليومية.",
  efPoints: ["وصول إلى وحدات وحصص لا يبلغها مكتب واحد بمفرده.",
             "رأي ثانٍ في كل تقييم قبل أن يصلك أي رقم.",
             "شركتان مسؤولتان عن الصفقة نفسها، لا طرف يأخذ عمولته ويختفي."],
  efCaption: "شراكة موقّعة وخطّ عمل مشترك. تتعامل مع MORE من البداية إلى النهاية.",
  devKicker: "المطوّرون والمنصّات التي نعمل معها",
  ctaKicker: "تواصل معنا", ctaTitle: "أخبرنا بما تحتاجه",
  ctaBody: "ثلاثة حقول، ثم يفتح واتساب والرسالة مكتوبة. لا نماذج تختفي في بريد إلكتروني.",

};
// Only photos/living-room.jpg was actually handed off (see README under handoff 2/landing) —
// every role uses it as the role-band's faint background rather than the four separate
// per-role photos the original design called for. Swap in the other three if they're ever
// supplied.
const ROLES = {
  tenant: { icon: "🔑", photo: "photos/living-room.jpg",
    en: { name: "Tenant", tag: "You need somewhere to live.",
      head: "You need a home that matches its photographs.",
      steps: ["Tell us the area, the budget and the date you need the keys.",
              "We only send you units we have stood inside ourselves.",
              "Contract in plain language, deposit agreed in writing before you sign."],
      foot: "Two weeks, no local number, no idea what things cost. We close that gap — it's most of the work.",
      cta: "Tell us what you're looking for", placeholder: "Area, budget, when you need to move in" },
    ar: { name: "مستأجر", tag: "تبحث عن مكان للسكن.",
      head: "تحتاج منزلاً يطابق صوره.",
      steps: ["أخبرنا بالمنطقة والميزانية وموعد استلام المفاتيح.",
              "لا نرسل لك إلا وحدات وقفنا بداخلها بأنفسنا.",

      foot: "أسبوعان، بلا رقم محلي، وبلا فكرة عن الأسعار. نحن نسدّ هذه الفجوة — وهي معظم العمل.",

  landlord: { icon: "🏠", photo: "photos/living-room.jpg",
    en: { name: "Landlord", tag: "You own a unit to rent out.",
      head: "You need rent on time and one person who answers.",
      steps: ["We price the unit against what actually rented nearby, not what was asked.",
              "We photograph it, list it, and screen everyone who views it.",
              "Rent collected, a statement every month, repairs handled without calling you."],
      foot: "We manage units in TMG and Nasr City today. Ask to see the owner statement we send — it reconciles to the pound.",
      cta: "Ask about managing your unit", placeholder: "Where is the unit, and is it furnished?" },
    ar: { name: "مالك", tag: "لديك وحدة للإيجار.",
      head: "تحتاج إيجاراً في موعده وشخصاً واحداً يردّ.",
      steps: ["نسعّر الوحدة بما أُجّر فعلاً في المنطقة، لا بما طُلب.",

      foot: "ندير اليوم وحدات في TMG ومدينة نصر. اطلب كشف المالك الذي نرسله — يُطابق حتى الجنيه.",
      cta: "اسأل عن إدارة وحدتك", placeholder: "أين الوحدة، وهل هي مفروشة؟" } },
  buyer: { icon: "📐", photo: "photos/living-room.jpg",
    en: { name: "Buyer", tag: "You are buying to live or to hold.",
      head: "You need the real price per metre.",
      steps: ["We ask what you want the unit to do — live in it, hold it, or resell it.",
              "You get options across developers, not one developer's price list.",
              "The payment plan is checked to year four, not just the down payment."],
      foot: "We are a TMG ambassador. Most brokers steer clients away from Madinaty and Al Rehab, because TMG pays them nothing — we show you them anyway. With Emaar, Sabbour and ORA we are paid the same whichever you pick. Either way the incentive is yours, not ours.",
      cta: "Ask for options", placeholder: "Budget, area, and whether it's to live in or hold" },
    ar: { name: "مشترٍ", tag: "تشتري للسكن أو للاستثمار.",
      head: "تحتاج السعر الحقيقي للمتر.",
      steps: ["نسألك ما الذي تريده من الوحدة — سكن، أم احتفاظ، أم إعادة بيع.",
              "تحصل على خيارات من عدة مطوّرين، لا قائمة أسعار مطوّر واحد.",
              "نراجع خطة السداد حتى السنة الرابعة، لا المقدَّم فقط."],
      foot: "نحن سفير معتمد لـ TMG. معظم الوسطاء يبعدون العملاء عن مدينتي والرحاب لأن TMG لا تدفع لهم عمولة — ونحن نعرضها عليك رغم ذلك. ومع إعمار وصبور وأورا نتقاضى الشيء نفسه أياً كان اختيارك. في الحالتين، المصلحة مصلحتك لا مصلحتنا.",
      cta: "اطلب الخيارات", placeholder: "الميزانية والمنطقة، وهل هي للسكن أم للاستثمار" } },
  seller: { icon: "🪧", photo: "photos/living-room.jpg",
    en: { name: "Seller", tag: "You have a unit to sell.",
      head: "You need the honest number, then a buyer who completes.",
      steps: ["A valuation with the comparables written down, so you can check our working.",
              "Listed where buyers for your unit actually look, not everywhere at once.",
              "We handle viewings, offers and paperwork through to transfer."],
      foot: "If the flattering number is what you want, another office will give it to you. It will still sell at the real one, six months later.",
      cta: "Ask what it's worth", placeholder: "Where is the unit, and when do you need to sell?" },
    ar: { name: "بائع", tag: "لديك وحدة للبيع.",
      head: "تحتاج الرقم الصادق، ثم مشترياً يُتمّ الصفقة.",
      steps: ["تقييم بمقارنات مكتوبة، حتى تتمكّن من مراجعة حساباتنا.",
              "يُعرض حيث يبحث مشترو وحدتك فعلاً، لا في كل مكان دفعة واحدة.",
              "نتولّى المعاينات والعروض والأوراق حتى التسجيل."],
      foot: "إن كان الرقم المُرضي هو ما تريده، فمكتب آخر سيمنحك إياه. وستبيع بالرقم الحقيقي بعد ستة أشهر على أي حال.",
      cta: "اسأل عن قيمتها", placeholder: "أين الوحدة، ومتى تحتاج البيع؟" } }
};
const LOCATIONS = [
  { en: ["New Cairo", "Compounds, resale and primary. Where most of our buyers land."],
    ar: ["القاهرة الجديدة", "كمبوندات، إعادة بيع وبرايمري. حيث يستقرّ أغلب مشترينا."] },
  { en: ["TMG", "Madinaty and Al Rehab. Where we hand over and manage."],
    ar: ["TMG", "مدينتي والرحاب. حيث نسلّم وندير."] },
  { en: ["Nasr City", "Our own street. Apartments, long lets, owners we know by name."],
    ar: ["مدينة نصر", "شارعنا. شقق وإيجارات طويلة ومُلّاك نعرفهم بالاسم."] },
  { en: ["New Capital", "Primary only, for now. We will say so when that changes."],
    ar: ["العاصمة الإدارية", "برايمري فقط، حتى الآن. سنقول متى يتغيّر ذلك."] },
  { en: ["North Coast", "Seasonal, and it moves fast. Ask early."],
    ar: ["الساحل الشمالي", "موسمي، ويتحرّك بسرعة. اسأل مبكراً."] }
];
const PROOF = [
  { size: "400", unit: "m²", en: ["TMG", "Handed over & managed", "Villa · B10 G104", "4 bedrooms · furnished · guest villa"],
    ar: ["TMG", "سُلّمت ومُدارة", "فيلا · B10 G104", "٤ غرف · مفروشة · فيلا ضيافة"] },
  { size: "165", unit: "m²", en: ["Nasr City", "Handed over 2025", "Apartment · Abbas El Akkad", "3 bedrooms · 2 baths · furnished"],
    ar: ["مدينة نصر", "سُلّمت 2025", "شقة · عباس العقاد", "٣ غرف · حمّامان · مفروشة"] },
  { size: "12", unit: "units", en: ["New Cairo", "Sourced", "Coldwell · partner desk", "Sourced and shared, 50 / 50 split"],

];
const DEVELOPERS = ["Emaar", "Al Ahly Sabbour", "ORA", "TMG", "Coldwell", "Nawy"];

const PHONE = "201508500099";
const WA_BASE = "https://wa.me/" + PHONE;

let state = { role: "tenant", lang: "en", name: "", msg: "" };

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function buildWaLink(){
  const ar = state.lang === "ar";
  const a = ROLES[state.role][ar ? "ar" : "en"];
  const lines = [
    (ar ? "مرحباً MORE، أنا " : "Hello MORE, I'm ") + (state.name || "—"),
    (ar ? "أنا: " : "I'm a: ") + a.name,
    state.msg || a.placeholder
  ];
  return WA_BASE + "?text=" + encodeURIComponent(lines.join("\n"));
}

function roleChip(k, on, dense){
  const ar = state.lang === "ar";
  const r = ROLES[k][ar ? "ar" : "en"];
  if (dense) {
    return `<div class="lp-chip" data-chip="${k}" style="border:1px solid ${on?"#08304A":"rgba(8,48,74,.14)"};background:${on?"#08304A":"#FBF7F1"};color:${on?"#FFFFFF":"rgba(8,48,74,.7)"};border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer">${esc(r.name)}</div>`;
  }
  return `<div class="lp-role-card" data-role-pick="${k}" style="border:1px solid ${on?"#08304A":"rgba(8,48,74,.14)"};background:${on?"#08304A":"#FFFFFF"};border-radius:16px;padding:20px 22px;cursor:pointer;display:flex;flex-direction:column;gap:8px">
    <div style="font-size:22px;line-height:1">${ROLES[k].icon}</div>
    <div style="font-family:Poppins,sans-serif;font-size:18px;font-weight:600;color:${on?"#FFFFFF":"#08304A"}">${esc(r.name)}</div>
    <div style="font-size:13px;font-weight:300;line-height:1.6;color:${on?"rgba(255,255,255,.72)":"rgba(8,48,74,.66)"}">${esc(r.tag)}</div>
  </div>`;
}

function render(){
  const ar = state.lang === "ar";
  const t = ar ? AR : EN;
  const L = ar ? "ar" : "en";
  const a = ROLES[state.role][L];
  const dir = ar ? "rtl" : "ltr";
  const font = ar ? "'IBM Plex Sans Arabic', Poppins, sans-serif" : "Poppins, sans-serif";
  const fabSide = ar ? "left" : "right";
  const langLabel = ar ? "English" : "العربية";

  const rolePicker = Object.keys(ROLES).map(k => roleChip(k, k === state.role, false)).join("");
  const rolePickerChips = Object.keys(ROLES).map(k => roleChip(k, k === state.role, true)).join("");
  const steps = a.steps.map((v, i) => `<div style="display:flex;flex-direction:column;gap:12px;border-top:2px solid rgba(232,152,104,.45);padding-top:18px">
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:#E89868">0${i+1}</div>
      <div style="font-size:16px;font-weight:300;line-height:1.72;color:rgba(255,255,255,.86)">${esc(v)}</div>
    </div>`).join("");
  const locCards = LOCATIONS.map(l => `<div class="lp-card" style="background:#FFFFFF;border:1px solid rgba(8,48,74,.12);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px">
      <div style="font-family:Poppins,sans-serif;font-size:19px;font-weight:600;color:#08304A">${esc(l[L][0])}</div>
      <div style="width:34px;height:2px;background:#E89868"></div>
      <div style="font-size:13.5px;font-weight:300;line-height:1.7;color:rgba(8,48,74,.74)">${esc(l[L][1])}</div>
    </div>`).join("");
  const proofCards = PROOF.map(p => `<div style="background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
        <div style="font-size:11.5px;font-weight:600;letter-spacing:2.4px;text-transform:uppercase;color:#E89868">${esc(p[L][0])}</div>
        <div style="font-size:11px;font-weight:500;padding:4px 10px;border-radius:999px;background:rgba(232,152,104,.18);color:#F0B48A;white-space:nowrap">${esc(p[L][1])}</div>
      </div>
      <div style="display:flex;align-items:baseline;gap:7px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:600;letter-spacing:-1px;color:#FFFFFF;line-height:1">${esc(p.size)}</div>
        <div style="font-size:14px;font-weight:400;color:rgba(255,255,255,.6)">${esc(p.unit)}</div>
      </div>
      <div style="height:1px;background:rgba(255,255,255,.16)"></div>
      <div style="font-size:14.5px;font-weight:500;color:#FFFFFF">${esc(p[L][2])}</div>
      <div style="font-size:13px;font-weight:300;line-height:1.65;color:rgba(255,255,255,.66)">${esc(p[L][3])}</div>
    </div>`).join("");
  const efPoints = t.efPoints.map(v => `<div style="display:flex;gap:13px;align-items:baseline">
      <div style="width:6px;height:6px;border-radius:999px;background:#E89868;flex:none;transform:translateY(-2px)"></div>
      <div style="font-size:15px;font-weight:300;line-height:1.7;color:rgba(8,48,74,.8)">${esc(v)}</div>
    </div>`).join("");
  const devChips = DEVELOPERS.map(n => `<div style="border:1px solid rgba(8,48,74,.16);border-radius:999px;padding:10px 22px;font-family:Poppins,sans-serif;font-size:14.5px;font-weight:500;color:rgba(8,48,74,.78);white-space:nowrap">${esc(n)}</div>`).join("");

  return `
  <div class="lp" dir="${dir}" style="font-family:${font};color:#08304A;background:#FBF7F1;overflow-x:clip;position:relative">

    <div style="position:sticky;top:0;z-index:40;background:rgba(5,33,49,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(232,152,104,.22)">
      <div class="lp-nav" style="max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px">
        <div style="display:flex;align-items:center;gap:12px;flex:none">
          <img src="more-mark.png" alt="MORE" style="width:34px;height:31px;object-fit:contain">

function wire(){
  const app = document.getElementById("app");
  app.querySelectorAll("[data-role-pick]").forEach(el => {
    el.addEventListener("click", () => { state.role = el.getAttribute("data-role-pick"); mount(); });
  });
  app.querySelectorAll("[data-chip]").forEach(el => {
    el.addEventListener("click", () => { state.role = el.getAttribute("data-chip"); mount(); });
  });
  const lang = app.querySelector("[data-lang-toggle]");
  if (lang) lang.addEventListener("click", () => { state.lang = state.lang === "ar" ? "en" : "ar"; mount(); });
  const nameEl = document.getElementById("fldName");
  const msgEl = document.getElementById("fldMsg");
  const waBtn = document.getElementById("waBtn");
  if (nameEl) nameEl.addEventListener("input", () => { state.name = nameEl.value; if (waBtn) waBtn.href = buildWaLink(); });
  if (msgEl) msgEl.addEventListener("input", () => { state.msg = msgEl.value; if (waBtn) waBtn.href = buildWaLink(); });
}

function mount(){
  document.getElementById("app").innerHTML = render();
  wire();
}
